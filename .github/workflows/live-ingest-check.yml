name: Live abuse.ch ingestion check

# Validates ingest/malwarebazaar.rs and ingest/threatfox.rs against the real
# abuse.ch APIs. Deliberately NOT part of ci.yml / the PR merge gate: it
# depends on an external service's uptime and a real API key, neither of
# which should be able to block routine merges. Runs on a schedule and can
# be triggered manually; requires the ABUSECH_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Get a free key at https://auth.abuse.ch/. Without the secret set, this
# workflow reports that plainly and exits rather than failing confusingly.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Least privilege for GITHUB_TOKEN -- see the matching block in ci.yml.
# It matters more here than there: this is the one workflow handling a real
# repository secret (ABUSECH_API_KEY). It only checks out and runs a test;
# it never writes to the repo.
permissions:
  contents: read

# ABUSECH_API_KEY is deliberately NOT in the job-level `env`. A review
# caught that a job-level secret is in the environment of *every* step in
# the job, including the third-party actions that run before the test --
# so an upstream compromise of any of them would have had the live API key
# available. Two changes close that:
#
#   1. The secret is exposed to exactly one step (`Run live ingestion
#      test`), the only one that needs it. The presence check that decides
#      whether to skip receives a *boolean* (`secrets.X != ''`), never the
#      value, so it can report a missing key without holding one.
#   2. Third-party actions are pinned to immutable commit SHAs rather than
#      mutable tags/branches -- see ci.yml's header for the pinning policy
#      and the annotated-tag gotcha when re-pinning.
#
# This workflow is also schedule/`workflow_dispatch`-only and never runs on
# `pull_request`, so a fork PR cannot reach the secret at all. That was
# already true and is worth keeping true: do not add a `pull_request`
# trigger here.

jobs:
  live-ingest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsic
          POSTGRES_PASSWORD: nsic
          POSTGRES_DB: nsic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nsic:nsic@localhost:5432/nsic
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for API key
        # Receives only whether the secret is set, never its value -- the
        # skip decision needs a boolean, so that is all this step gets.
        env:
          HAS_API_KEY: ${{ secrets.ABUSECH_API_KEY != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::warning::ABUSECH_API_KEY repository secret is not set; skipping live ingestion check. See workflow file header for setup."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libyara-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        if: env.SKIP != 'true'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.SKIP != 'true'
        with:
          workspaces: .

      - name: Install sqlx-cli
        if: env.SKIP != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run migrations
        if: env.SKIP != 'true'
        working-directory: src-tauri
        run: cargo sqlx migrate run

      # The only step that actually needs the key, and so the only one that
      # gets it.
      - name: Run live ingestion test
        if: env.SKIP != 'true'
        working-directory: src-tauri
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
        run: cargo test live_abusech_sync_works -- --ignored --nocapture
