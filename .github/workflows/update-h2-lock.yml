name: Temporary h2 lockfile security update

on:
  push:
    branches:
      - codex/issue-20-relate-orion-hardening

# Temporary branch-scoped maintenance workflow. It exists only to let Cargo
# regenerate the lockfile for RUSTSEC-2026-0258 rather than hand-editing the
# generated Cargo.lock. Delete this workflow after the generated lockfile
# commit lands.
permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/issue-20-relate-orion-hardening
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - name: Update only h2 to patched release
        run: cargo update -p h2 --precise 0.4.16

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already contains h2 0.4.16; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update h2 to 0.4.16"
          git push origin HEAD:codex/issue-20-relate-orion-hardening
