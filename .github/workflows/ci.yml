name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Without an explicit block a workflow
# inherits the repository default, which can include write scopes none of
# these jobs need -- every job here only checks out and builds/tests, none
# writes to the repo, publishes, or comments. Flagged by CodeQL
# (code-scanning alert 5) against the supply-chain job added in cd3bf5a.
# A job that legitimately needs more should widen it at the job level
# rather than loosening this default. See docs/threat-model.md (CI/CD).
permissions:
  contents: read

# Third-party actions are pinned to full-length commit SHAs, not mutable
# tags/branches. `@v4` and `@stable` are pointers their owner can move, so
# trusting them means trusting whatever they point at on every future run;
# a SHA is immutable. The trailing comment records which human-readable
# version each SHA was, so updates stay reviewable (Dependabot's
# github-actions ecosystem updates pinned SHAs and rewrites that comment).
#
# Note when re-pinning: resolve the *commit*, not the tag object.
# `Swatinem/rust-cache`'s `v2` is an annotated tag, so `refs/tags/v2` is a
# tag object (49a0bdc7...) and only `refs/tags/v2^{}` gives the commit
# (6323deb1...) that Actions needs -- `git ls-remote <url> 'refs/tags/v2^{}'`.
#
# `dtolnay/rust-toolchain` selects its toolchain from the *ref name*
# (`@stable` is a branch, not a version), so pinning by SHA drops that
# signal -- hence the explicit `toolchain: stable` input at each use.
# Pinning the action does not pin the Rust version: it still installs
# whatever `stable` resolves to at run time.

jobs:
  windows-filesystem:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Compile Windows backend and filesystem regressions
        working-directory: src-tauri
        run: cargo test --no-run

      - name: Reject intermediate junction replacement
        working-directory: src-tauri
        run: cargo test intermediate_directory_replaced_with_in_scope_junction_is_inconclusive

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsic
          POSTGRES_PASSWORD: nsic
          POSTGRES_DB: nsic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nsic:nsic@localhost:5432/nsic
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libyara-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Verify Rust toolchain
        run: |
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run migrations
        working-directory: src-tauri
        run: cargo sqlx migrate run

      - name: cargo test (including DB-backed integration tests)
        working-directory: src-tauri
        # live_abusech_sync_works needs a real ABUSECH_API_KEY and is
        # deliberately not run here; see live-ingest-check.yml.
        run: cargo test -- --include-ignored --skip live_abusech_sync_works

  # Phase 1 scaffolding (crates/nsic-core, crates/agent, crates/console).
  # Split from the `backend` job because none of these three need the
  # WebKitGTK/GTK system libraries src-tauri does on Linux -- they're plain
  # Rust binaries/libs, and keeping that true is part of the point of
  # having pulled them out of src-tauri. See docs/phase1-design.md.
  workspace-crates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsic
          POSTGRES_PASSWORD: nsic
          POSTGRES_DB: nsic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nsic:nsic@localhost:5432/nsic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        # Only libyara-dev, unlike the backend job: crates/agent now links
        # YARA (nsic-core's yara-scan feature) but none of these three
        # crates need src-tauri's GTK/WebKitGTK stack.
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: cargo check (nsic-core, agent, console)
        run: cargo check -p nsic-core -p agent -p console --all-targets

      - name: cargo clippy (nsic-core, agent, console)
        run: cargo clippy -p nsic-core -p agent -p console --no-deps -- -D warnings

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run migrations
        working-directory: src-tauri
        run: cargo sqlx migrate run

      - name: cargo test (nsic-core, agent, console, including DB-backed integration tests)
        run: cargo test -p nsic-core -p agent -p console -- --include-ignored

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev

  # Supply-chain check, per docs/threat-model.md. Added after an open
  # Dependabot alert went unread across seven review rounds on PR #19:
  # a advisory scan nobody is required to look at is not a control.
  # Triaged exceptions live in .cargo/audit.toml, each with a written
  # reason and a re-check condition -- never a blanket suppression.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
