name: Temporary normalize h2 lockfile diff

on:
  push:
    branches:
      - codex/issue-20-relate-orion-hardening

# One-shot branch maintenance: reconstruct Cargo.lock from PR #19's frozen
# base and change only the h2 version/checksum required by RUSTSEC-2026-0258.
# Delete this workflow after the generated commit lands.
permissions:
  contents: write

jobs:
  normalize-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/issue-20-relate-orion-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild minimal h2 lockfile patch from PR 19 base
        env:
          PR19_BASE: 75f44904817519a1af4338757a08ac1f366d3106
        run: |
          git show "$PR19_BASE:Cargo.lock" > Cargo.lock
          python - <<'PY'
          from pathlib import Path
          p = Path("Cargo.lock")
          text = p.read_text()
          old = '''[[package]]\nname = "h2"\nversion = "0.4.15"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\nchecksum = "6cb093c84e8bd9b188d4c4a8cb6579fc016968d14c99882163cd3ff402a4f155"'''
          new = '''[[package]]\nname = "h2"\nversion = "0.4.16"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\nchecksum = "a9f37a958b41b3b19ee2707c06439c0e9e547e847223eb791ecb0cb821c65e27"'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one h2 0.4.15 block, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit minimal generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already minimal; nothing to commit."
            exit 0
          fi
          git commit -m "chore: keep h2 security update lockfile-only"
          git push origin HEAD:codex/issue-20-relate-orion-hardening
