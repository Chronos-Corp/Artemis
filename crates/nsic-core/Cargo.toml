[package]
name = "nsic-core"
version = "0.1.0"
edition = "2021"
description = "Shared hashing, YARA scanning, and intel-graph types used by the Phase 0 desktop app and the Phase 1 agent/console, kept minimal by default so a given consumer only links what it actually needs."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"], optional = true }
yara = { version = "0.29", optional = true }
walkdir = { version = "2", optional = true }
libc = "0.2"

[features]
db = ["dep:sqlx"]
yara-scan = ["dep:yara", "dep:walkdir"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
